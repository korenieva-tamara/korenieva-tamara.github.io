  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background-color: #f7f5f0;
      color: #333;
      position: relative;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      opacity: 0.38;
    }

    .top {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
    }

    .close-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .close-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .menu {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 80px auto 0;
      padding: 0 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 36px;
      flex-wrap: nowrap;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .menu-item {
      min-width: 110px;
      flex-shrink: 0;
    }

    .menu-item > a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 19px;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .menu-item > a:hover {
      color: #6b7c3a;
    }

    .submenu a {
      display: block;
      text-decoration: none;
      color: #6b7c3a;
      font-size: 15.5px;
      margin-bottom: 8px;
    }

    .submenu a:hover {
      color: #333;
    }

    @media (max-width: 900px) {
      .menu {
        flex-wrap: wrap;
        gap: 28px;
        margin-top: 50px;
      }
    }

    @media (max-width: 600px) {
      .menu {
        gap: 22px;
        padding: 0 20px;
      }
      .top {
        padding: 20px 20px 8px;
      }
      .menu-item > a {
        font-size: 17px;
      }
    }
  </style>
</head>
