<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }

    /* Смуга з фіалками тільки внизу */
    .flowers {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28vh;           /* висота квіткової смуги */
      object-fit: cover;
      object-position: center;
      z-index: 1;
      display: block;
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .close-icon {
      font-size: 26px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .close-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    /* ===== МЕТЕЛИК ===== */
    .butterfly-wrapper {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      width: 46px;
      height: 38px;
      pointer-events: none;
    }

    .butterfly {
      width: 46px;
      height: 38px;
      position: relative;
    }

    .wing {
      position: absolute;
      width: 21px;
      height: 26px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }

    .wing.left {
      left: 2px;
      background: linear-gradient(135deg, #ff6b9d, #c44dff, #6b7c3a);
      transform-origin: right center;
      animation: flapLeft 0.38s ease-in-out infinite alternate;
    }

    .wing.right {
      right: 2px;
      background: linear-gradient(225deg, #ff6b9d, #c44dff, #6b7c3a);
      transform-origin: left center;
      animation: flapRight 0.38s ease-in-out infinite alternate;
    }

    .body {
      position: absolute;
      left: 50%;
      top: 7px;
      width: 4.5px;
      height: 20px;
      background: #333;
      border-radius: 3px;
      transform: translateX(-50%);
      z-index: 2;
    }

    .antenna {
      position: absolute;
      width: 1.5px;
      height: 11px;
      background: #333;
      top: 2px;
      border-radius: 1px;
    }

    .antenna.left  { left: 17px;  transform: rotate(-28deg); }
    .antenna.right { right: 17px; transform: rotate(28deg); }

    @keyframes flapLeft {
      from { transform: rotateY(0deg) scaleX(1); }
      to   { transform: rotateY(58deg) scaleX(0.82); }
    }

    @keyframes flapRight {
      from { transform: rotateY(0deg) scaleX(1); }
      to   { transform: rotateY(-58deg) scaleX(0.82); }
    }
    /* ===== кінець метелика ===== */

    .menu-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 150px;
      box-sizing: border-box;
    }

    .menu {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 42px;
      flex-wrap: nowrap;
      text-align: center;
    }

    .menu-item {
      min-width: 110px;
    }

    .menu-item > a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 19px;
      letter-spacing: 0.5px;
      margin-bottom: 13px;
      transition: color 0.2s;
    }

    .menu-item > a:hover {
      color: #6b7c3a;
    }

    .submenu a {
      display: block;
      text-decoration: none;
      color: #6b7c3a;
      font-size: 15.5px;
      margin-bottom: 8px;
      transition: color 0.2s;
    }

    .submenu a:hover {
      color: #333;
    }

    @media (max-width: 900px) {
      .menu {
        flex-wrap: wrap;
        gap: 28px;
      }
      .menu-wrapper {
        padding-top: 140px;
      }
      .flowers {
        height: 24vh;
      }
    }

    @media (max-width: 600px) {
      .top {
        padding: 18px 20px;
      }
      .menu-wrapper {
        padding-top: 125px;
        padding-left: 14px;
        padding-right: 14px;
      }
      .menu-item > a {
        font-size: 17px;
      }
      .butterfly-wrapper {
        top: 68px;
        transform: translateX(-50%) scale(0.88);
      }
      .flowers {
        height: 22vh;
      }
    }
  </style>
</head>

  </div>

        </div>
      </div>

      <div class="menu-item">

      </div>

      <div class="menu-item">

        <div class="submenu">

          <a href="sviatohirsk.html">Sviatohirsk, Ukraine — Before 2022</a>
          <a href="mrs-hannusia.html">Mrs. Hannusia</a>

      </div>

      <div class="menu-item">

</html>
