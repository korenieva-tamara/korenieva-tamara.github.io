<head>

  <title>Menu — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .close-icon {
      font-size: 26px;
      text-decoration: none;
      color: white;
      line-height: 1;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .close-icon:hover {
      color: #c5d4a0;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      color: white;
      margin: 0;
      font-weight: normal;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      text-align: center;
      padding: 80px 30px 40px;
      box-sizing: border-box;
    }

    .menu-item {
      min-width: 130px;
    }

    .menu-item > a {
      display: block;
      text-decoration: none;
      color: white;
      font-size: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
      transition: color 0.25s;
    }

    .menu-item > a:hover {
      color: #c5d4a0;
    }

    .submenu a {
      display: block;
      text-decoration: none;
      color: #e8e4d9;
      font-size: 16px;
      margin-bottom: 8px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      transition: color 0.25s;
    }

    .submenu a:hover {
      color: #c5d4a0;
    }

    @media (max-width: 700px) {
      .menu {
        gap: 28px;
        padding: 70px 20px 30px;
      }
      .menu-item > a {
        font-size: 18px;
      }
      .submenu a {
        font-size: 15px;
      }
      .top {
        padding: 18px 20px;
      }
    }
  </style>
