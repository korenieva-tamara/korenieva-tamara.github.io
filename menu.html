    body {
      margin: 0;

    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;

    .close-icon {

    }

    .close-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .menu-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16vh 30px 40px;
      box-sizing: border-box;
    }

    .menu {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 38px;
      flex-wrap: nowrap;
      text-align: center;
    }

    .menu-item {
      min-width: 110px;
    }

    .menu-item > a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 19px;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .menu-item > a:hover {
      color: #6b7c3a;
    }

    .submenu a {
      display: block;
      text-decoration: none;
      color: #6b7c3a;
      font-size: 15.5px;
      margin-bottom: 8px;
    }

    .submenu a:hover {
      color: #333;
    }

    @media (max-width: 900px) {
      .menu {
        flex-wrap: wrap;
        gap: 28px;
      }
    }

    @media (max-width: 600px) {
      .top {
        padding: 18px 20px;
      }
      .menu-wrapper {
        padding: 12vh 16px 30px;
      }
      .menu-item > a {
        font-size: 17px;
      }
    }
