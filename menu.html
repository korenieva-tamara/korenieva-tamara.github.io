<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }

    .flowers {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28vh;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      display: block;
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .close-icon {
      font-size: 26px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .close-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .menu-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 140px;
      box-sizing: border-box;
    }

    .menu {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 42px;
      flex-wrap: nowrap;
      text-align: center;
    }

    .menu-item {
      min-width: 110px;
    }

    .menu-item > a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 19px;
      letter-spacing: 0.5px;
      margin-bottom: 13px;
      transition: color 0.2s;
    }

    .menu-item > a:hover {
      color: #6b7c3a;
    }

    .submenu a {
      display: block;
      text-decoration: none;
      color: #6b7c3a;
      font-size: 15.5px;
      margin-bottom: 8px;
      transition: color 0.2s;
    }

    .submenu a:hover {
      color: #333;
    }

    /* ===== ТРИ МЕТЕЛИКИ ===== */
    .butterflies {
      position: absolute;
      bottom: 35vh;          /* трохи вище квітів */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 48px;
      z-index: 15;
      pointer-events: none;
    }

    .bf {
      width: 28px;
      height: 24px;
      position: relative;
    }

    .bf .wing {
      position: absolute;
      width: 13px;
      height: 16px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }

    .bf .wing.left {
      left: 1px;
      transform-origin: right center;
      animation: flapLeft 0.4s ease-in-out infinite alternate;
    }

    .bf .wing.right {
      right: 1px;
      transform-origin: left center;
      animation: flapRight 0.4s ease-in-out infinite alternate;
    }

    .bf .body {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 3px;
      height: 13px;
      background: #333;
      border-radius: 2px;
      transform: translateX(-50%);
      z-index: 2;
    }

    /* Кольори */
    .bf.purple .wing {
      background: linear-gradient(135deg, #c44dff, #9b59b6);
    }
    .bf.yellow .wing {
      background: linear-gradient(135deg, #ffd700, #f1c40f);
    }
    .bf.green .wing {
      background: linear-gradient(135deg, #6b7c3a, #8bc34a);
    }

    @keyframes flapLeft {
      from { transform: rotateY(0deg) scaleX(1); }
      to   { transform: rotateY(55deg) scaleX(0.8); }
    }

    @keyframes flapRight {
      from { transform: rotateY(0deg) scaleX(1); }
      to   { transform: rotateY(-55deg) scaleX(0.8); }
    }
    /* ===== кінець метеликів ===== */

    @media (max-width: 900px) {
      .menu {
        flex-wrap: wrap;
        gap: 28px;
      }
      .menu-wrapper {
        padding-top: 130px;
      }
      .butterflies {
        gap: 36px;
        bottom: 28vh;
      }
      .flowers {
        height: 24vh;
      }
    }

    @media (max-width: 600px) {
      .top {
        padding: 18px 20px;
      }
      .menu-wrapper {
        padding-top: 115px;
        padding-left: 14px;
        padding-right: 14px;
      }
      .menu-item > a {
        font-size: 17px;
      }
      .butterflies {
        gap: 28px;
        bottom: 25vh;
        transform: translateX(-50%) scale(0.9);
      }
      .flowers {
        height: 22vh;
      }
    }
  </style>
</head>
<body>

          <a href="photo-watercolors.html">Photo-Watercolors</a>
          <a href="collages.html">Collages</a>
        </div>
      </div>

      <div class="menu-item">
        <a href="macro.html">Macro</a>
      </div>

      <div class="menu-item">
        <a href="#">Photography</a>
        <div class="submenu">
          <a href="passing-by.html">Passing By…</a>
          <a href="rural-life.html">Rural Life</a>
          <a href="sviatohirsk.html">Sviatohirsk, Ukraine — Before 2022</a>
          <a href="mrs-hannusia.html">Mrs. Hannusia</a>
        </div>
      </div>

      <div class="menu-item">

      <div class="menu-item">

    </div>

  <!-- Три маленькі метелики між меню і фіалками -->
  <div class="butterflies">
    <div class="bf purple">
      <div class="wing left"></div>
      <div class="wing right"></div>
      <div class="body"></div>
    </div>
    <div class="bf yellow">
      <div class="wing left"></div>

    </div>
    <div class="bf green">
