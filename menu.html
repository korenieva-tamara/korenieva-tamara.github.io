<!DOCTYPE html>
<html lang="uk">
<head>

  <title>Menu — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;

    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;

    .close-icon {

      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;

    .column h2 {
      font-size: 16px;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 0 0 18px 0;

    }

    .column a {
      display: block;
      text-decoration: none;
      color: #6b7c3a;
      font-size: 15px;
      margin-bottom: 12px;
      transition: color 0.2s;
    }

    .column a:hover {
      color: #333;
    }

    .main-link {

      margin-bottom: 16px;
