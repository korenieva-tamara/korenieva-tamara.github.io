<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
    }

    .menu-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .menu-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .slider {
      max-width: 1100px;
      margin: 40px auto 60px;
      padding: 0 20px;
      position: relative;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 0.8s ease;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="menu.html" class="menu-icon">☰</a>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="slider">
    <div class="slides" id="slides">
      <img src="macro.jpg" alt="Macro">
      <img src="dark-light.jpg" alt="Out of Darkness">
      <img src="photo-watercolors.jpg" alt="Photo-Watercolors">
      <img src="colors.jpg" alt="Searching for Colors">
    </div>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const total = slides.children.length;
    let index = 0;

    setInterval(() => {
      index = (index + 1) % total;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }, 4000); // зміна кожні 4 секунди
  </script>

</body>
</html>
