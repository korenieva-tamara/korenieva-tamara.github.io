<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
      flex-shrink: 0;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .menu-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .menu-icon:hover {
      color: #6b7c3a;
    }

    .lang-switch {
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #888;
      user-select: none;
    }

    .lang-switch span {
      cursor: pointer;
      transition: color 0.2s;
    }

    .lang-switch span:hover {
      color: #6b7c3a;
    }

    .lang-switch .active {
      color: #333;
      font-weight: 600;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .slider {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      overflow: hidden;
    }

    .slides-wrapper {
      width: 100%;
      max-width: 1100px;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
      display: block;
    }

    @media (max-width: 600px) {
      .top {
        padding: 20px 20px 8px;
      }
      .left-controls {
        gap: 14px;
      }
      .lang-switch {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="left-controls">
      <a href="menu.html" class="menu-icon">☰</a>
      <div class="lang-switch">
        <span data-lang="en" class="active">EN</span>
        <span> | </span>
        <span data-lang="uk">УКР</span>
      </div>
    </div>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="slider">
    <div class="slides-wrapper">
      <div class="slides" id="slides">
        <img src="macro.jpg" alt="Macro">
        <img src="dark-light.jpg" alt="Out of Darkness">
        <img src="photo-watercolors.jpg" alt="Photo-Watercolors">
        <img src="colors.jpg" alt="Searching for Colors">
        <!-- дублюємо першу картинку для плавного циклу -->
        <img src="macro.jpg" alt="Macro">
      </div>
    </div>
  </div>

  <script>
    // ===== Мова =====
    const langSwitch = document.querySelector('.lang-switch');
    const langButtons = langSwitch.querySelectorAll('[data-lang]');

    function setLanguage(lang) {
      localStorage.setItem('siteLang', lang);
      document.documentElement.lang = lang;

      langButtons.forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Ініціалізація
    const savedLang = localStorage.getItem('siteLang') || 'en';
    setLanguage(savedLang);

    // Клік по перемикачу
    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang);
      });
    });

    // ===== Слайдер =====
    const slides = document.getElementById('slides');
    const totalReal = 4;
    let index = 0;

    setInterval(() => {
      index++;
      slides.style.transition = 'transform 1s ease-in-out';
      slides.style.transform = `translateX(-${index * 100}%)`;

      if (index === totalReal) {
        setTimeout(() => {
          slides.style.transition = 'none';
          index = 0;
          slides.style.transform = 'translateX(0)';
        }, 1000);
      }
    }, 4000);
  </script>

</body>
</html>
