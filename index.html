<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
      flex-shrink: 0;
    }

    .menu-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .menu-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .slider {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      overflow: hidden;
    }

    .slides-wrapper {
      width: 100%;
      max-width: 1100px;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="menu.html" class="menu-icon">☰</a>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="slider">
    <div class="slides-wrapper">
      <div class="slides" id="slides">
        <img src="macro.jpg" alt="Macro">
        <img src="dark-light.jpg" alt="Out of Darkness">
        <img src="photo-watercolors.jpg" alt="Photo-Watercolors">
        <img src="colors.jpg" alt="Searching for Colors">
        <!-- дублюємо першу картинку для плавного циклу -->
        <img src="macro.jpg" alt="Macro">
      </div>
    </div>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const totalReal = 4; // справжніх картинок
    let index = 0;

    setInterval(() => {
      index++;
      slides.style.transition = 'transform 1s ease-in-out';
      slides.style.transform = `translateX(-${index * 100}%)`;

      // коли дійшли до дубліката першої — миттєво повертаємось на справжню першу
      if (index === totalReal) {
        setTimeout(() => {
          slides.style.transition = 'none';
          index = 0;
          slides.style.transform = 'translateX(0)';
        }, 1000);
      }
    }, 7000);
  </script>

</body>
</html>
