<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
      flex-shrink: 0;
    }

    .menu-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .menu-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .slider {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .slides {
      position: relative;
      width: 100%;
      max-width: 1100px;
    }

    .slides img {
      width: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .slides img.active {
      opacity: 1;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="menu.html" class="menu-icon">☰</a>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="slider">
    <div class="slides" id="slides">
      <img src="macro.jpg" alt="Macro" class="active">
      <img src="dark-light.jpg" alt="Out of Darkness">
      <img src="photo-watercolors.jpg" alt="Photo-Watercolors">
      <img src="colors.jpg" alt="Searching for Colors">
    </div>
  </div>

  <script>
    const images = document.querySelectorAll('#slides img');
    let index = 0;

    setInterval(() => {
      images[index].classList.remove('active');
      index = (index + 1) % images.length;
      images[index].classList.add('active');
    }, 4500);
  </script>

</body>
</html>
