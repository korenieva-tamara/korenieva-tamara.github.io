<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Search of Color — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #333;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 10px;
    }

    .close-icon {
      font-size: 28px;
      text-decoration: none;
      color: #333;
      line-height: 1;
    }

    .close-icon:hover {
      color: #6b7c3a;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
      color: #6b7c3a;
      margin: 0;
      font-weight: normal;
    }

    .content {
      max-width: 1200px;
      margin: 40px auto 80px;
      padding: 0 40px;
    }

    .title {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 18px;
      color: #333;
    }

    .title .accent {
      color: #b22222;
    }

    .quote {
      font-size: 15px;
      color: #6b7c3a;
      max-width: 620px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .author {
      font-size: 14px;
      color: #6b7c3a;
      margin-bottom: 16px;
    }

    .personal {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: #c9a227;
      margin-bottom: 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr 1.1fr;
      gap: 20px;
      align-items: start;
    }

    .left-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      display: block;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .gallery img:hover {
      opacity: 0.9;
    }

    .tall {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    /* Повноекранний перегляд */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: white;
      font-size: 36px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="menu.html" class="close-icon">×</a>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="content">
    <h2 class="title">In Search <span class="accent">o</span>f Color...</h2>
    
    <p class="quote">
      “Color is an entire region of the electromagnetic spectrum, while a specific color corresponds to a single wavelength within that spectrum, measurable with a monochromator.”
    </p>
    <p class="author">B. Jenichen</p>
    
    <p class="personal">But to me, color remains an unfathomable mystery...</p>

    <div class="gallery">
      <div class="left-grid">
        <img src="color-green.jpg" alt="Green" onclick="openLightbox(this)">
