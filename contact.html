<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Korenieva Tamara</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      height: 100vh;
      overflow: hidden;
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .close-icon {
      font-size: 26px;
      text-decoration: none;
      color: white;
      line-height: 1;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    .close-icon:hover {
      color: #c5d4a0;
    }

    .logo {
      font-size: 20px;
      letter-spacing: 3px;
      color: white;
      margin: 0;
      font-weight: normal;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 20px;
      box-sizing: border-box;
    }

    .title {
      font-size: 32px;
      font-weight: normal;
      margin: 0 0 20px 0;
      color: #f5f2e9;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      letter-spacing: 1px;
    }

    .text {
      font-size: 17px;
      color: #f0ebe0;
      line-height: 1.6;
      margin: 0 0 32px 0;
      max-width: 420px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    .email {
      font-size: 19px;
      color: #c5d4a0;
      text-decoration: none;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      transition: color 0.25s;
    }

    .email:hover {
      color: #e0e8c8;
    }

    @media (max-width: 600px) {
      .top {
        padding: 18px 20px;
      }
      .title {
        font-size: 26px;
      }
      .text {
        font-size: 15px;
      }
      .email {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <img src="contact-bg.jpg" alt="" class="background">

  <div class="top">
    <a href="menu.html" class="close-icon">×</a>
    <h1 class="logo">KORENIEVA TAMARA</h1>
  </div>

  <div class="content">
    <h2 class="title">Contact</h2>
    <p class="text">
      If you would like to get in touch,<br>
      feel free to write to me.
    </p>
    <a class="email" href="mailto:KTA0711gm@gmail.com">KTA0711gm@gmail.com</a>
  </div>

</body>
</html>
